name = "ballsville-leaderboard"
# Pin a recent date; doesn't have to match exactly
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

# Let Wrangler know where the Pages build artifacts land
# (what next-on-pages generates)
pages_build_output_dir = ".vercel/output/static"

# ===== Bindings =====

# KV: used to store schedule + last_run_ts
[[kv_namespaces]]
binding = "CONFIG_KV"
# Replace with your actual namespace IDs from Dashboard → Workers KV
id = "2da9d70241d343d5aa35ef9651777c63"
preview_id = "2da9d70241d343d5aa35ef9651777c63"

# R2: where JSON files live (leaderboards.json, weekly_rosters_part*.json, etc.)
[[r2_buckets]]
binding = "LEADERBOARDS"
bucket_name = "leaderboard-data"
# If you created a separate preview bucket, set it here; otherwise you can omit:
# preview_bucket_name = "leaderboard-data"

# Environment vars (handy for local dev; in Cloudflare Pages UI you can also set them)
[vars]
# You can leave this out if you prefer to set it only in the Pages UI
ADMIN_TOKEN = "dev-only-token"


