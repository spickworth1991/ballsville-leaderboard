name: Update leaderboards (current season)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Ignore NFL game window and force generation"
        required: false
        default: "false"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate leaderboard JSON (auto CURRENT_SEASON)
        env:
          USE_CACHED_PLAYERS: "true"
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          node scripts/sched.js

      - name: Upload JSONs to R2 (current season + aliases)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: "leaderboard-data"
        run: |
          set -e

          if [ ! -f ".leaderboard_update_done" ]; then
            echo "ℹ️ No leaderboard update this run (outside NFL window) – skipping R2 upload."
            exit 0
          fi

          # Read CURRENT_SEASON from Node (same logic as auto-gen.js)
          YEAR=$(node -e "const d=new Date(); const y=d.getFullYear(); const m=d.getMonth()+1; process.stdout.write(String(m<=2?y-1:y));")
          echo "Uploading for CURRENT_SEASON=${YEAR}"

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 cp "auto/leaderboards_${YEAR}.json" "s3://${R2_BUCKET}/leaderboards_${YEAR}.json" --endpoint-url "$ENDPOINT"
          aws s3 cp "auto/leaderboards_${YEAR}.json" "s3://${R2_BUCKET}/leaderboards.json"       --endpoint-url "$ENDPOINT"

          aws s3 cp "auto/weekly_manifest_${YEAR}.json" "s3://${R2_BUCKET}/weekly_manifest_${YEAR}.json" --endpoint-url "$ENDPOINT"
          aws s3 cp "auto/weekly_manifest_${YEAR}.json" "s3://${R2_BUCKET}/weekly_manifest.json"        --endpoint-url "$ENDPOINT"

          for f in auto/weekly_rosters_${YEAR}_part*.json; do
            [ -e "$f" ] || continue
            base=$(basename "$f")

            aws s3 cp "$f" "s3://${R2_BUCKET}/${base}" --endpoint-url "$ENDPOINT"

            short_name="${base/weekly_rosters_${YEAR}_/weekly_rosters_}"
            aws s3 cp "$f" "s3://${R2_BUCKET}/${short_name}" --endpoint-url "$ENDPOINT"
          done

          echo "✅ R2 upload complete."
